[project]
name = "postgres-backup-aws-b2-digitalocean"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "pulumi==3.273.0",
  "pulumi-aws==7.52.1",
  "pulumi-digitalocean==4.84.1",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
